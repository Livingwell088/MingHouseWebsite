spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
server.error.include-message=never
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=256KB
restaurant.security.signing-secret=${CUSTOMER_SIGNING_SECRET:}
restaurant.admin.username=${ADMIN_USERNAME:admin}
restaurant.admin.password-hash=${ADMIN_PASSWORD_HASH:}
restaurant.orders.email=${ORDER_EMAIL:Livingwell088@gmail.com}
