# Every test context is isolated, including the legacy contextLoads test.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.mail.host=localhost
restaurant.mail.worker-enabled=false
restaurant.security.signing-secret=isolated-tests-only-secret-of-32-characters
